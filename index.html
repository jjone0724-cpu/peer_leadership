<!DOCTYPE html>
<html lang="ko">
<!-- lang="ko" 를 지우지 말 것.
     없으면 브라우저가 한자 글리프를 일본어 폰트에서 가져오고,
     스크린리더가 한국어를 영어로 읽는다. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 아래 세 줄을 본인 것으로 바꾼다. -->
  <title>정재원의 사이트</title>
  <meta name="description" content="">
  <meta name="author" content="">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <header>
      <h1>제목 없음</h1>
      <p class="lede">
        여기에 이 사이트가 무엇인지 한두 문장으로 쓴다.
        이름만 바꿔서 다른 사람 사이트에 넣어도 말이 되는 문장이면 다시 쓴다.
      </p>
    </header>

    <hr>

    <main>

      <section>
        <h2>섹션 하나</h2>
        <p>
          이 템플릿은 일부러 아무 스타일도 갖고 있지 않다.
          이미 꾸며져 있으면 고칠 것이 없어서 아무것도 배우지 못한다.
        </p>
        <p>
          섹션의 개수도, 이름도, 순서도 정해져 있지 않다.
          무엇을 먼저 보여줄지는 이 사이트를 보는 사람이 무엇을 궁금해하는지에 달려 있다.
        </p>
      </section>

      <section>
        <h2>섹션 둘</h2>
        <ul class="plain">
          <li>
            <h3>항목</h3>
            <p class="meta">보조 정보</p>
          </li>
          <li>
            <h3>항목</h3>
            <p class="meta">보조 정보</p>
          </li>
        </ul>
      </section>

    </main>

    <hr>

    <footer>
      <p class="meta">연락처 또는 링크</p>
    </footer>

  </div>

  <!-- script.js 는 필요할 때만 만든다.
       없어도 이 사이트는 동작해야 한다. -->

</body>
</html>
